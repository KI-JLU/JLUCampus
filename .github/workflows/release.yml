name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      artifact-suffix: ${{ github.event.release.tag_name }}
      retention-days: 90

  # The production image is built and pushed by docker.yml on the same event.
