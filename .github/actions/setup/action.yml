name: Setup
description: Install Bun and Node, restore the Bun cache and install dependencies

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    # The server targets Node 22; the design-system postinstall build runs npm.
    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - run: bun install --frozen-lockfile
      shell: bash
