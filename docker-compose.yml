# Local development infrastructure: Postgres and Keycloak.
# Ports avoid 5432, which another project on this machine already uses.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: justcampus
      POSTGRES_PASSWORD: justcampus
      POSTGRES_DB: justcampus
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U justcampus -d justcampus']
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: 'false'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres-data:
